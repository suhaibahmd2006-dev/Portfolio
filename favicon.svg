<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e0c"/>
      <stop offset="100%" stop-color="#040504"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8AF65"/>
      <stop offset="45%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#4B80F2"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Squircle with Hairline Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5"/>

  <!-- Orbital Cyber Coordinate Ring -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="rgba(75, 128, 242, 0.22)" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Redesigned 'ᜰ' Glyph: Text with fallback artistic vector curves -->
  <g filter="url(#softGlow)">
    <!-- High-Resolution Render of ᜰ -->
    <text x="32" y="43" font-size="34" font-weight="900" font-family="'Plus Jakarta Sans', 'Segoe UI Historic', 'Noto Sans Tagbanwa', system-ui, sans-serif" fill="url(#glowGrad)" text-anchor="middle">ᜰ</text>
  </g>

  <!-- Accent Status Node (Margiela Blue + Amber Pip) -->
  <circle cx="50" cy="14" r="2.5" fill="#4B80F2"/>
  <circle cx="14" cy="50" r="1.5" fill="#D8AF65"/>
</svg>
